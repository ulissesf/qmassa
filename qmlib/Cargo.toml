[package]
name = "qmlib"
version = "2.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "qmassa's GPU stats library"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
log = "0.4.33"
nix = { version = "0.30.1", features = ["ioctl"] }
nvml-wrapper = { version = "0.12.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
udev = { version = "0.9.3", features = ["hwdb"] }

[lints]
workspace = true

[features]
default = ["nvidia"]
nvidia = ["dep:nvml-wrapper"]
